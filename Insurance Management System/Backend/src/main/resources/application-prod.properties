# Database (values come from server environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Admin account created at startup if it does not exist
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Render provides the port through the PORT variable
server.port=${PORT:8080}

# Do not leak internal error details
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
logging.level.root=INFO